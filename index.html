<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A letter for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --night: #2a1a2e;
    --plum: #4a2c4f;
    --rose: #e8a0b4;
    --blush: #fbe9ee;
    --paper: #fff8fa;
    --ink: #4a2c3a;
    --gold: #d9a86c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 20%, var(--plum), var(--night) 70%);
    color: var(--ink);
    font-family: "Fraunces", Georgia, serif;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* soft floating hearts */
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .heart {
    position: absolute; bottom: -40px; color: var(--rose); opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(.8); opacity: 0; }
    15% { opacity: .5; }
    100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
  }

  .stage { width: min(92vw, 560px); padding: 24px 0 48px; text-align: center; position: relative; z-index: 1; }

  /* envelope */
  .envelope-wrap { transition: opacity .6s ease, transform .6s ease, height .6s ease; }
  .envelope-wrap.gone { opacity: 0; transform: translateY(20px) scale(.95); height: 0; overflow: hidden; pointer-events: none; }
  .hint { color: var(--blush); font-family: "Caveat", cursive; font-size: 1.7rem; margin-bottom: 20px; }
  .envelope {
    position: relative; width: 100%; aspect-ratio: 3 / 2; background: #f3c7d3;
    border-radius: 10px; box-shadow: 0 24px 50px rgba(0,0,0,.4); cursor: pointer; border: 0; display: block;
  }
  .envelope:focus-visible { outline: 3px solid var(--gold); outline-offset: 6px; }
  .flap {
    position: absolute; inset: 0 0 50% 0; background: #ebafc0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 10px 10px 0 0;
  }
  .fold-l, .fold-r {
    position: absolute; bottom: 0; width: 50%; height: 62%; background: #f0b8c8;
  }
  .fold-l { left: 0; clip-path: polygon(0 0, 100% 100%, 0 100%); border-radius: 0 0 0 10px; }
  .fold-r { right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); border-radius: 0 0 10px 0; }
  .seal {
    position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%);
    width: 64px; height: 64px; border-radius: 50%; background: #b8325a;
    display: grid; place-items: center; color: #ffd9e3; font-size: 1.9rem;
    box-shadow: 0 4px 10px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.2);
    animation: beat 1.8s ease-in-out infinite;
  }
  @keyframes beat { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.1); } }

  /* letter */
  .letter {
    background: var(--paper);
    border-radius: 6px;
    padding: clamp(28px, 6vw, 52px);
    text-align: left;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    background-image: repeating-linear-gradient(transparent 0 33px, rgba(232,160,180,.22) 33px 34px);
    display: none;
  }
  .letter.show { display: block; animation: unfold .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes unfold { from { opacity: 0; transform: translateY(30px) scale(.97); } to { opacity: 1; transform: none; } }

  .to { font-family: "Caveat", cursive; font-size: 2.1rem; color: #a02c52; margin-bottom: 14px; }
  .letter p { font-size: 1.08rem; line-height: 34px; margin-bottom: 34px; max-width: 62ch; opacity: 0; }
  .letter.show p { animation: fadein .8s ease forwards; }
  .letter.show p:nth-of-type(1) { animation-delay: .8s; }
  .letter.show p:nth-of-type(2) { animation-delay: 2.2s; }
  .letter.show p:nth-of-type(3) { animation-delay: 3.6s; }
  .letter.show p:nth-of-type(4) { animation-delay: 5s; }
  @keyframes fadein { to { opacity: 1; } }
  .sign { font-family: "Caveat", cursive; font-size: 1.9rem; color: #a02c52; line-height: 1.2; opacity: 0; }
  .letter.show .sign { animation: fadein .8s ease 6.4s forwards; }
  .sign small { display: block; font-size: 1.3rem; color: var(--ink); opacity: .8; }

  @media (prefers-reduced-motion: reduce) {
    .heart, .seal { animation: none; }
    .letter.show, .letter.show p, .letter.show .sign { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<main class="stage">
  <div class="envelope-wrap" id="envelopeWrap">
    <p class="hint" id="hint"></p>
    <button class="envelope" id="envelope" aria-label="Open the letter">
      <span class="flap"></span>
      <span class="fold-l"></span>
      <span class="fold-r"></span>
      <span class="seal">♥</span>
    </button>
  </div>

  <article class="letter" id="letter">
    <div class="to" id="to"></div>
    <p>
      Ayy Imi! Sid here. I have something very important to tell you, so listen carefully.
    </p>
    <p>
      I love you. Murtuem. Like, really really a lot.
    </p>
    <p>
      So blease be my unga forever. Okay? Okay.
    </p>
    <p>
      No thinking too much. Just say yes and make me the happiest person ever.
    </p>
    <div class="sign">
      Love,
      <small id="from"></small>
    </div>
  </article>
</main>

<script>
  // ✏️ EDIT THESE TWO LINES
  const HER_NAME = "Imi";
  const YOUR_NAME = "Sid";

  document.getElementById("to").textContent = "Ayy " + HER_NAME + "!";
  document.getElementById("from").textContent = YOUR_NAME;
  document.getElementById("hint").textContent = "A letter for you, " + HER_NAME + ". Tap to open.";

  const envelope = document.getElementById("envelope");
  const wrap = document.getElementById("envelopeWrap");
  const letter = document.getElementById("letter");

  envelope.addEventListener("click", () => {
    wrap.classList.add("gone");
    setTimeout(() => letter.classList.add("show"), 450);
  });

  // gentle floating hearts
  const box = document.getElementById("hearts");
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let i = 0; i < 14; i++) {
      const h = document.createElement("span");
      h.className = "heart";
      h.textContent = "♥";
      h.style.left = Math.random() * 100 + "%";
      h.style.fontSize = 12 + Math.random() * 18 + "px";
      h.style.animationDuration = 9 + Math.random() * 9 + "s";
      h.style.animationDelay = Math.random() * 10 + "s";
      box.appendChild(h);
    }
  }
</script>
</body>
</html>
